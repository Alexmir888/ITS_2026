services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-middleware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-kuka_middleware}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  middleware-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-kuka_middleware};Username=${POSTGRES_USER:-middleware};Password=${POSTGRES_PASSWORD:-local-dev-password}
      Authentication__ApiKey: ${MIDDLEWARE_API_KEY:-replace-this-local-key}
      KukaFm__BaseUrl: ${KUKA_FM_BASE_URL:-https://kukafm.its.fei}
      KukaFm__AuthorizationToken: ${KUKA_FM_TOKEN:-}
      KukaFm__AllowUntrustedCertificate: ${KUKA_FM_ALLOW_UNTRUSTED_CERTIFICATE:-false}
      KukaFm__PollIntervalSeconds: ${KUKA_FM_POLL_INTERVAL_SECONDS:-10}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: