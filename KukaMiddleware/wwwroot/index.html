<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KUKA Fleet Manager</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Fleet control</p>
          <h1>KUKA Fleet Manager</h1>
        </div>
        <div class="api-key-box">
          <label for="apiKeyInput">Ключ доступа</label>
          <div class="api-key-row">
            <input id="apiKeyInput" type="password" placeholder="MIDDLEWARE_API_KEY" autocomplete="current-password" />
            <button id="saveApiKeyBtn" type="button">Подключить</button>
          </div>
          <span id="connectionStatus" class="connection-status" role="status">Нет соединения</span>
        </div>
      </header>

      <main class="dashboard">
        <section class="panel dispatch-panel">
          <div class="panel-header">
            <h2>Новая миссия</h2>
          </div>
          <form id="dispatchForm" class="stack-form">
            <label for="robotId">
              Робот
              <select id="robotId" name="robotId" required disabled>
                <option value="">Сначала подключитесь</option>
              </select>
            </label>

            <label for="targetPoint">ID узла назначения</label>
            <input id="targetPoint" name="targetPoint" value="Labak-CHTN-22" list="knownNodes" required />
            <datalist id="knownNodes">
              <option value="Labak-CHTN-22" label="Узел 22"></option>
            </datalist>
            <p class="field-note">Узел 22 на карте · Labak-CHTN-22</p>

            <div class="actions">
              <button id="dispatchButton" type="submit" class="primary" disabled>Отправить</button>
            </div>
            <p id="dispatchStatus" class="dispatch-status" role="status" aria-live="polite"></p>
          </form>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Миссии</h2>
            <button id="refreshMissionsBtn" type="button" class="secondary" title="Обновить миссии">Обновить</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Код миссии</th>
                  <th>Робот</th>
                  <th>Статус</th>
                  <th>Создана</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="missionsTableBody"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Роботы</h2>
            <button id="refreshRobotsBtn" type="button" class="secondary" title="Обновить состояние роботов">Обновить</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID робота</th>
                  <th>Состояние</th>
                  <th>Обновлено</th>
                </tr>
              </thead>
              <tbody id="robotsTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/app.js"></script>
  </body>
</html>
