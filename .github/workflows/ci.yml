name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore KukaMiddleware/KukaMiddleware.csproj
      - run: dotnet build KukaMiddleware/KukaMiddleware.csproj --configuration Release --no-restore
      - run: dotnet test KukaMiddleware.Tests/KukaMiddleware.Tests.csproj --configuration Release
      - run: docker build -t kuka-middleware:${{ github.sha }} .